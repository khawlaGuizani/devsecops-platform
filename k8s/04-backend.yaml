apiVersion: apps/v1
kind: Deployment
metadata:
  name: transport-backend
  namespace: transport
spec:
  replicas: 1
  selector:
    matchLabels:
      app: transport-backend
  template:
    metadata:
      labels:
        app: transport-backend
    spec:
      initContainers:
        # Replaces Compose's one-shot db-init service: a fresh SQL Server
        # instance only has `master`; Spring's ddl-auto=update creates
        # tables, not the database itself. Idempotent, safe to rerun on
        # every pod (re)start.
        - name: db-init
          image: mcr.microsoft.com/mssql/server:2022-latest
          env:
            - name: MSSQL_SA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: transport-secrets
                  key: MSSQL_SA_PASSWORD
          command:
            - /bin/bash
            - -c
            - >-
              until /opt/mssql-tools18/bin/sqlcmd -C -S sqlserver -U sa -P "$MSSQL_SA_PASSWORD" -Q "SELECT 1" -b -o /dev/null; do
              echo waiting for sqlserver; sleep 5; done;
              /opt/mssql-tools18/bin/sqlcmd -C -S sqlserver -U sa -P "$MSSQL_SA_PASSWORD" -Q "IF DB_ID('vanoiseee') IS NULL CREATE DATABASE vanoiseee"
      containers:
        - name: backend
          image: transport-backend:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: transport-config
            - secretRef:
                name: transport-secrets
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: transport-secrets
                  key: MSSQL_SA_PASSWORD
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 750m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 45
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: transport-backend
  namespace: transport
spec:
  selector:
    app: transport-backend
  ports:
    - port: 8080
      targetPort: 8080
