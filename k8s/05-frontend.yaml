apiVersion: apps/v1
kind: Deployment
metadata:
  name: transport-frontend
  namespace: transport
spec:
  replicas: 1
  selector:
    matchLabels:
      app: transport-frontend
  template:
    metadata:
      labels:
        app: transport-frontend
    spec:
      containers:
        - name: frontend
          image: transport-frontend:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            # nginx's `resolver` directive doesn't apply /etc/resolv.conf's
            # search-domain suffixes, so it needs the backend Service's
            # fully-qualified name here — a bare "transport-backend" would
            # fail to resolve (see docker-start.sh / nginx.conf comments).
            - name: BACKEND_HOST
              value: transport-backend.transport.svc.cluster.local
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: transport-frontend
  namespace: transport
spec:
  selector:
    app: transport-frontend
  ports:
    - port: 8080
      targetPort: 8080
