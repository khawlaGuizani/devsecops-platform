# Copy to 01-secret.yaml (gitignored) and fill in real values, OR create the
# Secret imperatively instead (recommended — avoids ever writing the real
# values to a file on disk):
#
#   kubectl create secret generic transport-secrets -n transport \
#     --from-literal=MSSQL_SA_PASSWORD='...' \
#     --from-literal=MAIL_USERNAME='...' \
#     --from-literal=MAIL_PASSWORD='...'
#
apiVersion: v1
kind: Secret
metadata:
  name: transport-secrets
  namespace: transport
type: Opaque
stringData:
  MSSQL_SA_PASSWORD: "CHANGE_ME"
  MAIL_USERNAME: ""
  MAIL_PASSWORD: ""
